<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{ title }}</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="script.js"></script>
  </head>
  <body
    class="bg-gray-50 min-h-screen flex flex-col items-center justify-center"
  >
    <div class="w-full max-w-md p-8 bg-white rounded-lg shadow-lg">
      <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">
        Document Upload
      </h2>

      <form
        action="/convert"
        enctype="multipart/form-data"
        method="post"
        class="space-y-6"
      >
        <div>
          <label for="file" class="block text-sm font-medium text-gray-700 mb-2"
            >Choose a PDF file to upload:</label
          >
          <input
            type="file"
            name="file"
            accept=".pdf"
            class="block w-full text-sm text-gray-900 border border-gray-300 p-4 cursor-pointer bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
        <button
          type="submit"
          class="w-full py-2 px-4 bg-blue-600 text-white font-semibold rounded-lg shadow hover:bg-blue-700 transition"
        >
          Upload
        </button>
      </form>
    </div>

    {% if markdown is defined %}
    <div class="w-full max-w-3xl mt-8">
      <!-- Tab buttons -->
      <div class="flex border-b">
        <button id="html-tab" class="px-4 py-2 -mb-px border-b-2 border-blue-500 font-semibold text-blue-500">
          HTML
        </button>
        <button id="markdown-tab" class="px-4 py-2 font-semibold text-gray-500 hover:text-blue-500">
          Markdown
        </button>
      </div>

      <!-- Tab content -->
      <div id="html-content" class="p-6 bg-white rounded-b-lg rounded-tr-lg shadow-lg">
        <h3 class="font-semibold mb-4 text-gray-800">HTML Preview:</h3>
        <div class="prose max-w-none">{{ html | safe }}</div>
      </div>

      <div id="markdown-content" class="hidden p-4 bg-gray-100 rounded-b-lg rounded-tr-lg shadow-lg">
        <h3 class="font-semibold mb-2">Converted Markdown:</h3>
        <pre id="markdown" class="whitespace-pre-wrap">{{ markdown }}</pre>
      </div>
    </div>
    {% endif %}
  </body>
</html>
